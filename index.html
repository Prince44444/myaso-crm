    /* Скрытие скроллбаров для горизонтальных чипсов */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

      -ms-overflow-style: none;
      scrollbar-width: none;

    /* Плавное появление iOS Bottom Sheet */
    @keyframes sheetUp {
      from { transform: translateY(100%); opacity: 0.6; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }

    .animate-sheet {

  <script>
    /* =========================================================================
       МясоМикс CRM — ПОЛНАЯ БИЗНЕС-ЛОГИКА И UI
       Хранение: localStorage (автономная работа на iPhone / GitHub Pages)
       ========================================================================= */

    const STORAGE_KEY = 'myasomix_crm_v1';

    // Состав микса (из объявления на Авито)
    const RECIPE_INGREDIENTS = [
      { name: 'Свиное сердце', pct: 25, note: 'таурин' },
      { name: 'Куриные желудки', pct: 30, note: 'мышечная ткань' },
      { name: 'Куриные шеи (мелкая рубка)', pct: 15, note: 'кальций' },
      { name: 'Куриные головы (без клювов)', pct: 15, note: 'костная основа' },
      { name: 'Филе индейки / курицы', pct: 5, note: 'нежное мясо' },
      { name: 'Куриные сердца', pct: 4, note: 'витамины' },
      { name: 'Свежая морковь', pct: 3, note: 'клетчатка ЖКТ' },
    ];

    // Глобальное состояние UI (не сохраняется в localStorage)
    const uiState = {
      activeTab: 'home',
      chartPeriod: 'day', // 'day' | 'week' | 'month'
      salesFilter: 'all', // 'all' | 'promo' | 'regular'
      salesSearch: '',
      clientsSort: 'radar', // 'radar' | 'volume' | 'name'
      clientsSearch: '',
      calcOpen: false,
      calcMode: 'qty', // 'qty' | 'kg'
      calcValue: 35,
      charts: {
        finance: null,
        unit: null
      }
    };

    // Основное состояние данных
    let appData = null;

    /* =========================================================================
       УТИЛИТЫ ДАТ, ФОРМАТИРОВАНИЯ И БУФЕРА ОБМЕНА
       ========================================================================= */

    function toDateStr(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseLocalDate(str) {
      if (!str) return new Date();
      const [y, m, d] = str.split('-').map(Number);
      return new Date(y, (m || 1) - 1, d || 1);
    }

    function todayStr() {
      return toDateStr(new Date());
    }

    function daysAgoStr(daysAgo) {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() - daysAgo);
      return toDateStr(d);
    }

    function addDaysStr(dateStr, days) {
      const d = parseLocalDate(dateStr);
      d.setDate(d.getDate() + days);
      return toDateStr(d);
    }

    function diffDays(dateStrA, dateStrB) {
      const a = parseLocalDate(dateStrA);
      const b = parseLocalDate(dateStrB);
      return Math.round((b.getTime() - a.getTime()) / (1000 * 60 * 60 * 24));
    }

    function formatRub(val) {
      const num = Math.round(Number(val) || 0);
      return num.toLocaleString('ru-RU') + ' ₽';
    }

    function formatDateHuman(dateStr) {
      const t = todayStr();
      const y = daysAgoStr(1);
      if (dateStr === t) return 'Сегодня';
      if (dateStr === y) return 'Вчера';
      const d = parseLocalDate(dateStr);
      return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
    }

    function formatDateFull(dateStr) {
      const d = parseLocalDate(dateStr);
      return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function genId(prefix) {
      return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
    }

    // Надежное копирование в буфер обмена (работает и на iPhone Safari, и в iframe)
    function copyTextToClipboard(text, successMsg = 'Скопировано в буфер!') {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, 99999);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) {
          showToast(successMsg, 'success');
          return true;
        }
      } catch (e) {
        console.warn('Copy fallback error:', e);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => showToast(successMsg, 'success'))
          .catch(() => showToast('Не удалось скопировать текст', 'error'));
      } else {
        showToast('Не удалось скопировать текст', 'error');
      }
      return false;
    }

    /* =========================================================================
       TOAST-УВЕДОМЛЕНИЯ И КАСТОМНЫЙ CONFIRM (БЕЗ alert/confirm)
       ========================================================================= */

    function showToast(message, type = 'info', action = null) {
      const root = document.getElementById('toast-root');
      const id = genId('toast');
      const colors = {
        success: 'bg-[#162820]/95 border-[#22C55E]/40 text-emerald-100',
        error: 'bg-[#2A1519]/95 border-[#FF6B4A]/40 text-rose-100',
        warning: 'bg-[#292011]/95 border-[#F59E0B]/40 text-amber-100',
        info: 'bg-[#181D2B]/95 border-white/15 text-slate-100'
      };
      const dots = {
        success: 'bg-[#22C55E]',
        error: 'bg-[#FF6B4A]',
        warning: 'bg-[#F59E0B]',
        info: 'bg-[#38BDF8]'
      };

      const el = document.createElement('div');
      el.id = id;

    /**
     * Расчет цены продажи:
     * Базовая: 210 ₽/шт.
     * Скидка новичка: 3 шт за 550 ₽.
     * Если > 3 шт и скидка активна: 550 + (qty - 3) * 210.
     * Если 1 или 2 шт: qty * 210.
     */
    function calculateSalePrice(qty, applyPromo, unitPrice = appData.settings.unitPrice, promo3Price = appData.settings.promo3Price) {
      const q = Math.max(0, Number(qty) || 0);
      if (q === 0) return 0;
      if (applyPromo && q >= 3) {
        return promo3Price + (q - 3) * unitPrice;
      }
      return q * unitPrice;
    }

    function getClientById(id) {
      return appData.clients.find(c => c.id === id) || null;
    }

    function getClientSales(clientId) {
      return appData.sales
        .filter(s => s.clientId === clientId)
        .sort((a, b) => a.date.localeCompare(b.date));
    }

    /**
     * Умный прогноз повторного заказа для клиента:
     * - Группируем заказы клиента по датам.
     * - Если >= 2 разных дат:
     *   daysBetween = дней между первой и последней датой
     *   consumedQty = сумма банок во всех заказах КРОМЕ последнего дня
     *   daysPerUnit = daysBetween / consumedQty
     *   nextDate = lastDate + round(lastOrderQty * daysPerUnit)
     * - Если 1 дата (или 1 заказ):
     *   используем dailyRateOverride клиента или defaultDailyRate (1 банка/день -> 1 день на банку).
     */
    function computeClientForecast(client) {
      const sales = getClientSales(client.id);
      const totalOrders = sales.length;
      const totalQty = sales.reduce((sum, s) => sum + s.qty, 0);
      const totalSpent = sales.reduce((sum, s) => sum + s.totalPrice, 0);

      if (totalOrders === 0) {
        return {
          client,
          totalOrders: 0,
          totalQty: 0,
          totalSpent: 0,
          usualQty: 3,
          hasForecast: false,
          daysPerUnit: 1 / (client.dailyRateOverride || appData.settings.defaultDailyRate || 1),
          isSmartRate: false,
          lastOrderDate: null,
          lastOrderQty: 0,
          nextOrderDate: null,
          daysLeft: 999,
          cycleDays: 0,
          progressPct: 100,
          status: 'new'
        };
      }

      // Группировка по дате для устойчивости расчетов
      const byDateMap = new Map();
      sales.forEach(s => {
        byDateMap.set(s.date, (byDateMap.get(s.date) || 0) + s.qty);
      });
      const dateEntries = Array.from(byDateMap.entries()).sort((a, b) => a[0].localeCompare(b[0]));

      const firstDate = dateEntries[0][0];
      const lastDate = dateEntries[dateEntries.length - 1][0];
      const lastBatchQty = dateEntries[dateEntries.length - 1][1];
      const lastSingleOrderQty = sales[sales.length - 1].qty;

      const defaultDaysPerUnit = 1 / (appData.settings.defaultDailyRate || 1);
      let daysPerUnit;
      let isSmartRate = false;

      if (client.dailyRateOverride && client.dailyRateOverride > 0) {
        // Если пользователь вручную указал расход (например, 2 банки/день)
        daysPerUnit = 1 / client.dailyRateOverride;
        isSmartRate = false;
      } else if (dateEntries.length >= 2) {
        // 1. Темп (дней на 1 банку) на каждом отдельном интервале между заказами
        const intervals = [];
        for (let i = 0; i < dateEntries.length - 1; i++) {
          const gapDays = Math.max(1, diffDays(dateEntries[i][0], dateEntries[i + 1][0]));
          const prevQty = Math.max(1, dateEntries[i][1]);
          const obs = Math.max(0.15, Math.min(10, gapDays / prevQty));
          intervals.push(obs);
        }

        // 2. Фильтр отпусков и выбросов: отсекаем аномальные паузы относительно медианы
        let cleanIntervals = intervals;
        if (intervals.length >= 3) {
          const sorted = [...intervals].sort((a, b) => a - b);
          const mid = Math.floor(sorted.length / 2);
          const median = sorted.length % 2 === 0
            ? (sorted[mid - 1] + sorted[mid]) / 2
            : sorted[mid];
          const filtered = intervals.filter(v => v <= median * 2.2 && v >= median * 0.35);
          if (filtered.length > 0) cleanIntervals = filtered;
        }

        // 3. Экспоненциальное сглаживание (EWMA): свежие заказы весят больше старых
        const alpha = 0.45;
        let ewma = cleanIntervals[0];
        for (let i = 1; i < cleanIntervals.length; i++) {
          const val = cleanIntervals[i];
          const ratio = val / ewma;
          // Защита от внезапного отпуска на короткой истории — гасим резкий скачок
          const stepAlpha = (ratio > 2.2 || ratio < 0.35) ? 0.12 : alpha;
          ewma = stepAlpha * val + (1 - stepAlpha) * ewma;
        }

        // 4. Байесовский старт: мягко смешиваем базовую норму с реальной историей
        const priorWeight = 0.35;
        const n = cleanIntervals.length;
        daysPerUnit = (ewma * n + defaultDaysPerUnit * priorWeight) / (n + priorWeight);
        daysPerUnit = Math.max(0.15, Math.min(10, daysPerUnit));
        isSmartRate = true;
      } else {
        daysPerUnit = defaultDaysPerUnit;
        isSmartRate = false;
      }
      const cycleDays = Math.max(1, Math.round(lastBatchQty * daysPerUnit));
      const nextOrderDate = addDaysStr(lastDate, cycleDays);
      const today = todayStr();
      const daysLeft = diffDays(today, nextOrderDate); // отрицательное = просрочено
      const elapsedDays = Math.max(0, diffDays(lastDate, today));
      const progressPct = Math.max(0, Math.min(100, Math.round(((cycleDays - elapsedDays) / cycleDays) * 100)));

      let status = 'ok';
      if (daysLeft < 0) status = 'overdue';
      else if (daysLeft === 0) status = 'today';
      else if (daysLeft <= 3) status = 'soon';

      return {
        client,
        totalOrders,
        totalQty,
        totalSpent,
        usualQty: lastSingleOrderQty,
        hasForecast: true,
        daysPerUnit,
        isSmartRate,
        lastOrderDate: lastDate,
        lastOrderQty: lastBatchQty,
        nextOrderDate,
        daysLeft,
        cycleDays,
        progressPct,
        status
      };
    }

    function getAllClientForecasts() {
      return appData.clients.map(c => computeClientForecast(c));
    }

    /**
     * Общие финансовые и производственные показатели
     */
    function computeMetrics() {
      const totalRevenue = appData.sales.reduce((s, x) => s + x.totalPrice, 0);
      const totalPocket = appData.sales.reduce((s, x) => s + x.pocketShare, 0);
      const totalFundIncome = appData.sales.reduce((s, x) => s + x.fundShare, 0);
      const totalQtySold = appData.sales.reduce((s, x) => s + x.qty, 0);

      let totalMeatExpense = 0;
      let totalContainerExpense = 0;
      let totalProduced = 0;
      let totalContainersBought = 0;
      let bestBatch = null;

      appData.purchases.forEach(p => {
        totalMeatExpense += (Number(p.meatCost) || 0);
        totalContainerExpense += (Number(p.containersCost) || 0);
        totalProduced += (Number(p.qtyProduced) || 0);
        totalContainersBought += (Number(p.containersBought) || 0);

        if (p.type === 'meat' && p.qtyProduced > 0) {
          const unitMeatCost = p.meatCost / p.qtyProduced;
          if (!bestBatch || unitMeatCost < bestBatch.unitCost) {
            bestBatch = {
              date: p.date,
              qty: p.qtyProduced,
              unitCost: unitMeatCost,
              cost: p.meatCost
            };
          }
        }
      });

      const totalExpenses = totalMeatExpense + totalContainerExpense;
      const fundBalance = (Number(appData.settings.startingFund) || 0) + totalFundIncome - totalExpenses;
      const netProfit = totalRevenue - totalExpenses;
      const avgCheck = appData.sales.length > 0 ? Math.round(totalRevenue / appData.sales.length) : 0;

      // Средняя себестоимость 1 банки (мясо + тара)
      const avgMeatPerUnit = totalProduced > 0 ? (totalMeatExpense / totalProduced) : 0;
      let avgContainerPerUnit = 0;
      if (totalContainersBought > 0 && totalContainerExpense > 0) {
        avgContainerPerUnit = totalContainerExpense / totalContainersBought;
      } else if (totalProduced > 0 && totalContainerExpense > 0) {
        avgContainerPerUnit = totalContainerExpense / totalProduced;
      }

      const totalUnitCost = avgMeatPerUnit + avgContainerPerUnit;
      const unitMargin = Math.max(0, appData.settings.unitPrice - totalUnitCost);
      const marginPct = appData.settings.unitPrice > 0
        ? Math.round((unitMargin / appData.settings.unitPrice) * 100)
        : 0;

      return {
        totalRevenue,
        totalPocket,
        totalFundIncome,
        totalExpenses,
        totalMeatExpense,
        totalContainerExpense,
        fundBalance,
        netProfit,
        totalQtySold,
        totalProduced,
        avgCheck,
        avgMeatPerUnit,
        avgContainerPerUnit,
        totalUnitCost,
        unitMargin,
        marginPct,
        bestBatch
      };
    }

      }

    function buildFinanceBuckets(period) {
      const labels = [];
      const revenue = [];
      const pocket = [];
      const expenses = [];

      if (period === 'day') {
        // Последние 10 дней
        for (let i = 9; i >= 0; i--) {
          const ds = daysAgoStr(i);
          const d = parseLocalDate(ds);
          labels.push(`${d.getDate()}.${String(d.getMonth() + 1).padStart(2, '0')}`);

          const daySales = appData.sales.filter(s => s.date === ds);
          const dayPurch = appData.purchases.filter(p => p.date === ds);
          revenue.push(daySales.reduce((a, b) => a + b.totalPrice, 0));
          pocket.push(daySales.reduce((a, b) => a + b.pocketShare, 0));
          expenses.push(dayPurch.reduce((a, b) => a + (b.meatCost || 0) + (b.containersCost || 0), 0));
        }
      } else if (period === 'week') {
        // Последние 6 недель
        for (let w = 5; w >= 0; w--) {
          const startStr = daysAgoStr(w * 7 + 6);
          const endStr = daysAgoStr(w * 7);
          const sd = parseLocalDate(startStr);
          labels.push(`с ${sd.getDate()}.${String(sd.getMonth() + 1).padStart(2, '0')}`);

          const wSales = appData.sales.filter(s => s.date >= startStr && s.date <= endStr);
          const wPurch = appData.purchases.filter(p => p.date >= startStr && p.date <= endStr);
          revenue.push(wSales.reduce((a, b) => a + b.totalPrice, 0));
          pocket.push(wSales.reduce((a, b) => a + b.pocketShare, 0));
          expenses.push(wPurch.reduce((a, b) => a + (b.meatCost || 0) + (b.containersCost || 0), 0));
        }
      } else {
        // Последние 6 месяцев
        const now = new Date();
        for (let m = 5; m >= 0; m--) {
          const d = new Date(now.getFullYear(), now.getMonth() - m, 1);
          const ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
          labels.push(d.toLocaleDateString('ru-RU', { month: 'short' }));

          const mSales = appData.sales.filter(s => s.date.startsWith(ym));
          const mPurch = appData.purchases.filter(p => p.date.startsWith(ym));
          revenue.push(mSales.reduce((a, b) => a + b.totalPrice, 0));
          pocket.push(mSales.reduce((a, b) => a + b.pocketShare, 0));
          expenses.push(mPurch.reduce((a, b) => a + (b.meatCost || 0) + (b.containersCost || 0), 0));
        }
      }

      return { labels, revenue, pocket, expenses };
    }

            <div class="p-2 rounded-xl bg-white/[0.04]">

        <!-- Сворачиваемый Калькулятор мяса на партию -->
        <section class="glass-card rounded-[22px] overflow-hidden">

            <div class="flex items-center gap-2.5">

                  <line x1="8" y1="10" x2="10" y2="10"/><line x1="14" y1="10" x2="16" y2="10"/>
                  <line x1="8" y1="14" x2="10" y2="14"/><line x1="14" y1="14" x2="16" y2="14"/>

    function renderMeatCalculatorBody() {
      const val = Math.max(0.3, Number(uiState.calcValue) || 0);
      const totalKg = uiState.calcMode === 'qty' ? (val * 0.3) : val;
      const totalGrams = Math.round(totalKg * 1000);
      const estJars = Math.round(totalGrams / 300);
      const sumPct = RECIPE_INGREDIENTS.reduce((a, b) => a + b.pct, 0); // 97%

      const rows = RECIPE_INGREDIENTS.map(item => {
        const normRatio = item.pct / sumPct;
        const grams = Math.round(totalGrams * normRatio);
        return {
          ...item,
          grams,
          displayWeight: grams >= 1000 ? (grams / 1000).toFixed(2) + ' кг' : grams + ' г'
        };
      });

      return `
        <div class="px-4 pb-4 pt-1 border-t border-white/[0.06] space-y-3">
          <div class="flex p-1 rounded-xl bg-black/35 border border-white/[0.06] text-xs font-semibold">
            <button onclick="uiState.calcMode='qty'; uiState.calcValue=Math.max(1, Math.round(${estJars})); renderAll()" class="flex-1 py-1.5 rounded-lg transition ${uiState.calcMode === 'qty' ? 'bg-white/15 text-white' : 'text-slate-400'}">По банкам (шт)</button>
            <button onclick="uiState.calcMode='kg'; uiState.calcValue=Number((${totalKg}).toFixed(1)); renderAll()" class="flex-1 py-1.5 rounded-lg transition ${uiState.calcMode === 'kg' ? 'bg-white/15 text-white' : 'text-slate-400'}">По весу (кг)</button>
          </div>

          <div class="flex items-center gap-2">
            <input type="number" step="${uiState.calcMode === 'kg' ? '0.5' : '1'}" min="1" value="${uiState.calcValue}" oninput="uiState.calcValue=Number(this.value)||0; updateCalcDisplay()" class="w-28 px-3 py-2.5 rounded-xl bg-black/40 border border-white/10 text-base font-bold text-white tnum focus:outline-none focus:border-[#FF6B4A]" />
            <div class="flex-1 flex gap-1.5 overflow-x-auto no-scrollbar">
              ${(uiState.calcMode === 'qty' ? [20, 30, 40, 50] : [5, 10, 12, 15]).map(preset => `
                <button onclick="uiState.calcValue=${preset}; renderAll()" class="px-2.5 py-2 rounded-xl text-xs font-semibold border shrink-0 ${
                  Number(uiState.calcValue) === preset ? 'bg-[#FF6B4A]/20 border-[#FF6B4A]/40 text-[#FF6B4A]' : 'bg-white/[0.05] border-white/[0.08] text-slate-300'
                }">${preset} ${uiState.calcMode === 'qty' ? 'шт' : 'кг'}</button>
              `).join('')}
            </div>
          </div>

          <div id="calc-output-container">
            <div class="flex items-center justify-between text-xs px-1 mb-2">
              <span class="text-slate-400">Итого микса: <b class="text-white tnum">${totalKg.toFixed(1)} кг (~${estJars} шт)</b></span>
              <span class="text-[10px] text-slate-500">норм. к 100% (рецепт ${sumPct}%)</span>
            </div>

            <div class="rounded-2xl bg-black/30 border border-white/[0.06] divide-y divide-white/[0.05]">
              ${rows.map(r => `
                <div class="px-3 py-2 flex items-center justify-between gap-2 text-xs">
                  <div class="min-w-0">
                    <span class="text-slate-200 font-medium">${r.name}</span>
                    <span class="text-[10px] text-slate-500 ml-1">${r.pct}%</span>
                  </div>
                  <span class="font-bold text-white tnum shrink-0">${r.displayWeight}</span>
                </div>
              `).join('')}
            </div>

            <button onclick="copyRecipeList()" class="mt-2.5 w-full py-2.5 rounded-xl bg-white/[0.07] border border-white/[0.08] text-xs font-semibold text-slate-200 active:scale-[0.98] transition">
              📋 Скопировать список покупок в Заметки
            </button>
          </div>
        </div>
      `;
    }

    function updateCalcDisplay() {
      // Перерисовываем только блок результата без потери фокуса инпута
      const container = document.getElementById('calc-output-container');
      if (!container) return;
      const val = Math.max(0, Number(uiState.calcValue) || 0);
      const totalKg = uiState.calcMode === 'qty' ? (val * 0.3) : val;
      const totalGrams = Math.round(totalKg * 1000);
      const estJars = Math.round(totalGrams / 300);
      const sumPct = RECIPE_INGREDIENTS.reduce((a, b) => a + b.pct, 0);

      const rows = RECIPE_INGREDIENTS.map(item => {
        const grams = Math.round(totalGrams * (item.pct / sumPct));
        return {
          ...item,
          displayWeight: grams >= 1000 ? (grams / 1000).toFixed(2) + ' кг' : grams + ' г'
        };
      });

      container.innerHTML = `
        <div class="flex items-center justify-between text-xs px-1 mb-2">
          <span class="text-slate-400">Итого микса: <b class="text-white tnum">${totalKg.toFixed(1)} кг (~${estJars} шт)</b></span>
          <span class="text-[10px] text-slate-500">норм. к 100% (рецепт ${sumPct}%)</span>
        </div>
        <div class="rounded-2xl bg-black/30 border border-white/[0.06] divide-y divide-white/[0.05]">
          ${rows.map(r => `
            <div class="px-3 py-2 flex items-center justify-between gap-2 text-xs">
              <div class="min-w-0">
                <span class="text-slate-200 font-medium">${r.name}</span>
                <span class="text-[10px] text-slate-500 ml-1">${r.pct}%</span>
              </div>
              <span class="font-bold text-white tnum shrink-0">${r.displayWeight}</span>
            </div>
          `).join('')}
        </div>
        <button onclick="copyRecipeList()" class="mt-2.5 w-full py-2.5 rounded-xl bg-white/[0.07] border border-white/[0.08] text-xs font-semibold text-slate-200 active:scale-[0.98] transition">
          📋 Скопировать список покупок в Заметки
        </button>
      `;
    }

    function copyRecipeList() {
      const val = Math.max(0.3, Number(uiState.calcValue) || 0);
      const totalKg = uiState.calcMode === 'qty' ? (val * 0.3) : val;
      const totalGrams = Math.round(totalKg * 1000);
      const estJars = Math.round(totalGrams / 300);
      const sumPct = RECIPE_INGREDIENTS.reduce((a, b) => a + b.pct, 0);

      const lines = [
        `🥩 Закупка МясоМикс на ~${estJars} банок (${totalKg.toFixed(1)} кг):`,
        ...RECIPE_INGREDIENTS.map(item => {
          const grams = Math.round(totalGrams * (item.pct / sumPct));
          const w = grams >= 1000 ? (grams / 1000).toFixed(2) + ' кг' : grams + ' г';
          return `• ${item.name} — ${w}`;
        })
      ];
      copyTextToClipboard(lines.join('\n'), 'Список мяса скопирован!');
    }

    /* =========================================================================
       ВКЛАДКА 4: КЛИЕНТЫ И УМНЫЙ ПРОГНОЗ
       ========================================================================= */

    function renderClientsTab(forecasts) {
      const q = uiState.clientsSearch.trim().toLowerCase();
      let list = forecasts.filter(f => !q || f.client.name.toLowerCase().includes(q) || (f.client.contact || '').toLowerCase().includes(q));

      if (uiState.clientsSort === 'radar') {
        list.sort((a, b) => a.daysLeft - b.daysLeft);
      } else if (uiState.clientsSort === 'volume') {
        list.sort((a, b) => b.totalQty - a.totalQty);
      } else {
        list.sort((a, b) => a.client.name.localeCompare(b.client.name, 'ru'));
      }

      return `
        <!-- Поиск и кнопка добавления клиента -->
        <section class="flex items-center gap-2">
          <div class="relative flex-1">
            <svg class="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" value="${escapeHtml(uiState.clientsSearch)}" oninput="uiState.clientsSearch=this.value; renderAll()" placeholder="Поиск клиента..." class="w-full pl-10 pr-4 py-2.5 rounded-2xl bg-[#151924] border border-white/[0.08] text-sm text-white placeholder-slate-500 focus:outline-none focus:border-[#F59E0B]/60" />
          </div>
          <button onclick="openClientDetailModal(null)" class="px-3.5 py-2.5 rounded-2xl bg-white/[0.08] border border-white/10 text-xs font-bold text-white active:scale-95 transition shrink-0">
            + Клиент
          </button>
        </section>

        <!-- Сортировка -->
        <section class="flex gap-2 overflow-x-auto no-scrollbar">
          ${[
            { k: 'radar', l: 'По прогнозу (срочные)' },
            { k: 'volume', l: 'По объему (VIP)' },
            { k: 'name', l: 'По алфавиту' }
          ].map(s => `
            <button onclick="uiState.clientsSort='${s.k}'; renderAll()" class="px-3.5 py-1.5 rounded-full text-xs font-semibold shrink-0 border transition ${
              uiState.clientsSort === s.k
                ? 'bg-[#F59E0B]/15 border-[#F59E0B]/40 text-[#F59E0B]'
                : 'bg-white/[0.04] border-white/[0.07] text-slate-400'
            }">${s.l}</button>
          `).join('')}
        </section>

        <!-- Карточки клиентов -->
        ${list.length === 0 ? `
          <div class="glass-card rounded-[22px] p-8 text-center">
            <p class="text-sm font-semibold text-slate-200">Клиентов пока нет</p>
            <p class="text-xs text-slate-400 mt-1">Они создаются автоматически при добавлении продажи</p>
          </div>
        ` : `
          <section class="space-y-3">
            ${list.map(f => renderClientCard(f)).join('')}
          </section>
        `}
      `;
    }

    function renderClientCard(f) {
      let statusLabel = 'Нет заказов';
      let statusCls = 'bg-slate-500/15 text-slate-400 border-slate-500/25';
      let barCls = 'bg-slate-600';

      if (f.hasForecast) {
        if (f.daysLeft < 0) {
          statusLabel = `Пора писать! (-${Math.abs(f.daysLeft)} дн.)`;
          statusCls = 'bg-rose-500/20 text-rose-300 border-rose-500/35';
          barCls = 'bg-rose-500';
        } else if (f.daysLeft === 0) {
          statusLabel = 'Заканчивается сегодня!';
          statusCls = 'bg-[#FF6B4A]/20 text-[#FF6B4A] border-[#FF6B4A]/35';
          barCls = 'bg-[#FF6B4A]';
        } else if (f.daysLeft <= 3) {
          statusLabel = `Через ${f.daysLeft} дн.`;
          statusCls = 'bg-[#F59E0B]/20 text-[#F59E0B] border-[#F59E0B]/35';
          barCls = 'bg-[#F59E0B]';
        } else {
          statusLabel = `Запас ${f.daysLeft} дн.`;
          statusCls = 'bg-[#22C55E]/15 text-[#22C55E] border-[#22C55E]/30';
          barCls = 'bg-[#22C55E]';
        }
      }

      const rateText = f.isSmartRate
        ? `реальный темп ~${f.daysPerUnit.toFixed(1)} дн/шт`
        : `${(1 / f.daysPerUnit).toFixed(1)} шт/день`;

      return `
        <div class="glass-card rounded-[22px] p-4 space-y-3">
          <div class="flex items-start justify-between gap-2 cursor-pointer" onclick="openClientDetailModal('${f.client.id}')">
            <div class="min-w-0">
              <div class="flex items-center gap-1.5">
                <h3 class="text-sm font-bold text-white truncate">${escapeHtml(f.client.name)}</h3>
                <svg class="w-3.5 h-3.5 text-slate-500 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
              </div>
              <p class="text-[11px] text-slate-400 mt-0.5 tnum">
                ${f.totalOrders} зак. • ${f.totalQty} шт • ${formatRub(f.totalSpent)}
              </p>
            </div>
            <span class="shrink-0 text-[10px] font-bold px-2.5 py-1 rounded-full border ${statusCls}">
              ${statusLabel}
            </span>
          </div>

          ${f.hasForecast ? `
            <div class="space-y-1.5">
              <div class="h-1.5 w-full rounded-full bg-white/[0.07] overflow-hidden">
                <div class="h-full rounded-full transition-all duration-500 ${barCls}" style="width: ${Math.max(4, f.progressPct)}%"></div>
              </div>
              <div class="flex items-center justify-between text-[10px] text-slate-400 tnum">
                <span>Прогноз: <b class="text-slate-200">${formatDateHuman(f.nextOrderDate)}</b></span>
                <span>${rateText}</span>
              </div>
            </div>
          ` : ''}

          <div class="grid grid-cols-2 gap-2 pt-0.5">
            <button onclick="copyAvitoForClient('${f.client.id}')" class="py-2 px-3 rounded-xl bg-white/[0.06] border border-white/[0.08] text-xs font-semibold text-slate-200 active:scale-95 transition flex items-center justify-center gap-1.5">
              <span>💬</span>
              <span>Сообщение Авито</span>
            </button>
            <button onclick="openSaleModal('${f.client.id}', ${f.usualQty})" class="py-2 px-3 rounded-xl bg-[#FF6B4A]/15 border border-[#FF6B4A]/30 text-xs font-bold text-[#FF6B4A] active:scale-95 transition">
              Повторить (${f.usualQty} шт)
            </button>
          </div>
        </div>
      `;
    }

    function copyAvitoForClient(clientId) {
      const client = getClientById(clientId);
      if (!client) return;
      const forecast = computeClientForecast(client);
      const msg = generateAvitoMessage(forecast);
      copyTextToClipboard(msg, 'Сообщение для Авито скопировано!');
    }

    /* =========================================================================
       МОДАЛЬНОЕ ОКНО: БАЗОВАЯ iOS BOTTOM-SHEET ОБОЛОЧКА
       ========================================================================= */

    function openSheetModal(innerHtml) {
      const root = document.getElementById('modal-root');
      root.classList.remove('hidden');
      root.innerHTML = `
        <div class="fixed inset-0 bg-black/70 backdrop-blur-sm animate-fade flex items-end sm:items-center justify-center" onclick="if(event.target===this) closeModal()">
          <div class="w-full max-w-[480px] max-h-[92vh] overflow-y-auto rounded-t-[28px] sm:rounded-[28px] bg-[#151924] border-t sm:border border-white/10 shadow-2xl animate-sheet" style="padding-bottom: env(safe-area-inset-bottom, 0px);">
            <div class="flex justify-center pt-2.5 pb-1 sm:hidden">
              <div class="w-10 h-1 rounded-full bg-white/20"></div>
            </div>
            ${innerHtml}
          </div>
        </div>
      `;
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      const root = document.getElementById('modal-root');
      root.classList.add('hidden');
      root.innerHTML = '';
      document.body.style.overflow = '';
    }

    /* =========================================================================
       МОДАЛКА: + ПРОДАЖА (МАКСИМАЛЬНО БЫСТРЫЙ ВВОД)
       ========================================================================= */

    const saleForm = {
      clientId: null,
      newClientName: '',
      qty: 3,
      applyPromo: true,
      manualPrice: null,
      date: todayStr(),
      note: ''
    };

    function openSaleModal(preselectClientId = null, preselectQty = null) {
      saleForm.clientId = preselectClientId;
      saleForm.newClientName = preselectClientId ? (getClientById(preselectClientId)?.name || '') : '';
      saleForm.qty = preselectQty || 3;
      saleForm.manualPrice = null;
      saleForm.date = todayStr();
      saleForm.note = '';

      // Автоматически определяем новичок или постоянный
      syncPromoByClient();
      renderSaleModal();
    }

    function syncPromoByClient() {
      if (saleForm.clientId) {
        const pastOrders = getClientSales(saleForm.clientId).length;
        saleForm.applyPromo = pastOrders === 0;
      } else {
        // Проверяем, не совпадает ли введенное имя с существующим клиентом
        const trimmed = saleForm.newClientName.trim().toLowerCase();
        const match = trimmed ? appData.clients.find(c => c.name.trim().toLowerCase() === trimmed) : null;
        if (match) {
          saleForm.clientId = match.id;
          saleForm.applyPromo = getClientSales(match.id).length === 0;
        } else {
          saleForm.applyPromo = true;
        }
      }
    }

    function renderSaleModal() {
      // Популярные клиенты для чипсов (по числу заказов / последнему заказу)
      const topClients = [...appData.clients]
        .sort((a, b) => getClientSales(b.id).length - getClientSales(a.id).length)
        .slice(0, 8);

      const pastOrders = saleForm.clientId ? getClientSales(saleForm.clientId).length : 0;
      const isNewClient = pastOrders === 0;
      const autoPrice = calculateSalePrice(saleForm.qty, saleForm.applyPromo);
      const finalPrice = saleForm.manualPrice !== null ? saleForm.manualPrice : autoPrice;
      const pocketPct = appData.settings.pocketPercent;
      const pocketShare = Math.round(finalPrice * (pocketPct / 100));
      const fundShare = finalPrice - pocketShare;
      const stockAfter = appData.inventory.freezerStock - saleForm.qty;
      const savings = (saleForm.applyPromo && saleForm.qty >= 3)
        ? (appData.settings.unitPrice * 3 - appData.settings.promo3Price)
        : 0;

      const tStr = todayStr();
      const yStr = daysAgoStr(1);

      openSheetModal(`
        <div class="p-5 space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="text-lg font-extrabold text-white">Новая продажа</h2>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-white/[0.08] flex items-center justify-center text-slate-400">✕</button>
          </div>

          <!-- Клиент -->
          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <label class="text-xs font-semibold text-slate-400">Клиент</label>
              <span id="sale-client-badge" class="text-[11px] font-semibold px-2 py-0.5 rounded-full ${
                isNewClient ? 'bg-[#FF6B4A]/15 text-[#FF6B4A]' : 'bg-[#22C55E]/15 text-[#22C55E]'
              }">
                ${isNewClient ? '✨ Новый клиент' : `⭐ Постоянный (${pastOrders} зак.)`}
              </span>
            </div>

            <input id="sale-client-input" type="text" value="${escapeHtml(saleForm.newClientName)}" oninput="onSaleClientInput(this.value)" placeholder="Имя нового клиента или выберите ниже..." class="w-full px-3.5 py-3 rounded-2xl bg-black/35 border border-white/10 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-[#FF6B4A]" />

            ${topClients.length > 0 ? `
              <div class="flex gap-1.5 overflow-x-auto no-scrollbar pt-0.5">
                ${topClients.map(c => {
                  const selected = saleForm.clientId === c.id;
                  return `<button type="button" onclick="selectSaleClient('${c.id}')" class="px-3 py-1.5 rounded-full text-xs font-semibold shrink-0 border transition ${
                    selected ? 'bg-[#FF6B4A] border-[#FF6B4A] text-white' : 'bg-white/[0.05] border-white/[0.08] text-slate-300'
                  }">${escapeHtml(c.name.split(' ')[0])}</button>`;
                }).join('')}
              </div>
            ` : ''}
          </div>

          <!-- Количество -->
          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <label class="text-xs font-semibold text-slate-400">Количество упаковок (300 г)</label>
              <span id="sale-weight-hint" class="text-xs text-slate-400 tnum">${(saleForm.qty * 0.3).toFixed(1)} кг</span>
            </div>

            <div class="flex items-center gap-2">
              <button type="button" onclick="changeSaleQty(-1)" class="w-12 h-12 rounded-2xl bg-white/[0.07] border border-white/10 text-xl font-bold text-white active:scale-90 transition">−</button>
              <input id="sale-qty-input" type="number" min="1" value="${saleForm.qty}" oninput="setSaleQty(Number(this.value)||1)" class="flex-1 h-12 text-center rounded-2xl bg-black/35 border border-white/10 text-xl font-extrabold text-white tnum focus:outline-none focus:border-[#FF6B4A]" />
              <button type="button" onclick="changeSaleQty(1)" class="w-12 h-12 rounded-2xl bg-white/[0.07] border border-white/10 text-xl font-bold text-white active:scale-90 transition">+</button>
            </div>

            <div class="grid grid-cols-6 gap-1.5">
              ${[1, 3, 5, 10, 15, 20].map(q => `
                <button type="button" onclick="setSaleQty(${q})" class="sale-qty-chip py-2 rounded-xl text-xs font-bold border tnum transition ${
                  saleForm.qty === q ? 'bg-[#FF6B4A]/20 border-[#FF6B4A] text-[#FF6B4A]' : 'bg-white/[0.04] border-white/[0.08] text-slate-300'
                }">${q}</button>
              `).join('')}
            </div>
          </div>

          <!-- Тумблер скидки первого заказа -->
          <div class="p-3.5 rounded-2xl bg-white/[0.04] border border-white/[0.08] flex items-center justify-between gap-3">
            <div>
              <p class="text-xs font-bold text-white">Скидка новичка (3 за ${appData.settings.promo3Price} ₽)</p>
              <p id="sale-promo-sub" class="text-[11px] text-slate-400 mt-0.5">
                ${saleForm.qty < 3 ? 'Действует при заказе от 3 штук' : (saleForm.applyPromo ? `Применена к первым 3 шт (скидка ${savings} ₽)` : 'Отключена — по базовой цене')}
              </p>
            </div>
            <button type="button" id="sale-promo-toggle" onclick="toggleSalePromo()" class="w-12 h-7 rounded-full p-1 transition-colors shrink-0 ${saleForm.applyPromo ? 'bg-[#FF6B4A]' : 'bg-white/15'}">
              <div class="w-5 h-5 rounded-full bg-white shadow transition-transform ${saleForm.applyPromo ? 'translate-x-5' : 'translate-x-0'}"></div>
            </button>
          </div>

          <!-- Итоговая сумма (можно редактировать вручную) -->
          <div class="grid grid-cols-2 gap-2.5">
            <div class="space-y-1">
              <label class="text-[11px] font-semibold text-slate-400">Сумма к оплате (₽)</label>
              <input id="sale-price-input" type="number" min="0" value="${finalPrice}" oninput="onSalePriceManual(this.value)" class="w-full px-3.5 py-2.5 rounded-2xl bg-black/35 border border-white/10 text-base font-extrabold text-white tnum focus:outline-none focus:border-[#FF6B4A]" />
            </div>
            <div class="space-y-1">
              <label class="text-[11px] font-semibold text-slate-400">Дата продажи</label>
              <div class="flex gap-1">
                <button type="button" onclick="setSaleDate('${tStr}')" class="flex-1 py-2.5 rounded-xl text-[11px] font-bold border ${saleForm.date === tStr ? 'bg-white/15 border-white/25 text-white' : 'bg-white/[0.04] border-white/[0.07] text-slate-400'}">Сег.</button>
                <button type="button" onclick="setSaleDate('${yStr}')" class="flex-1 py-2.5 rounded-xl text-[11px] font-bold border ${saleForm.date === yStr ? 'bg-white/15 border-white/25 text-white' : 'bg-white/[0.04] border-white/[0.07] text-slate-400'}">Вчера</button>
                <input type="date" value="${saleForm.date}" onchange="setSaleDate(this.value)" class="w-10 px-1 rounded-xl bg-white/[0.05] border border-white/10 text-[11px] text-white" />
              </div>
            </div>
          </div>

          <!-- Превью распределения и остатка -->
          <div id="sale-preview-box" class="p-3.5 rounded-2xl bg-black/30 border border-white/[0.06] grid grid-cols-3 gap-2 text-center tnum">
            <div>
              <p class="text-[10px] text-slate-400">В карман (${pocketPct}%)</p>
              <p class="text-xs font-bold text-[#22C55E] mt-0.5">+${formatRub(pocketShare)}</p>
            </div>
            <div>
              <p class="text-[10px] text-slate-400">В фонд (${100 - pocketPct}%)</p>
              <p class="text-xs font-bold text-slate-200 mt-0.5">+${formatRub(fundShare)}</p>
            </div>
            <div>
              <p class="text-[10px] text-slate-400">В морозилке</p>
              <p class="text-xs font-bold mt-0.5 ${stockAfter < 0 ? 'text-rose-400' : 'text-[#38BDF8]'}">${stockAfter} шт</p>
            </div>
          </div>

          <button id="sale-submit-btn" onclick="submitSale()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-[#FF6B4A] to-[#F43F5E] text-white font-extrabold text-sm shadow-xl shadow-[#FF6B4A]/25 active:scale-[0.98] transition tnum">
            Записать продажу • ${formatRub(finalPrice)}
          </button>
        </div>
      `);
    }

    function selectSaleClient(clientId) {
      const c = getClientById(clientId);
      if (!c) return;
      saleForm.clientId = c.id;
      saleForm.newClientName = c.name;
      saleForm.manualPrice = null;
      syncPromoByClient();
      renderSaleModal();
    }

    function onSaleClientInput(val) {
      saleForm.newClientName = val;
      const trimmed = val.trim().toLowerCase();
      const match = trimmed ? appData.clients.find(c => c.name.trim().toLowerCase() === trimmed) : null;
      saleForm.clientId = match ? match.id : null;
      saleForm.manualPrice = null;
      syncPromoByClient();
      updateSaleModalDynamicFields();
    }

    function setSaleQty(q) {
      saleForm.qty = Math.max(1, Math.min(500, Math.round(q)));
      saleForm.manualPrice = null;
      renderSaleModal();
    }

    function changeSaleQty(delta) {
      setSaleQty(saleForm.qty + delta);
    }

    function toggleSalePromo() {
      saleForm.applyPromo = !saleForm.applyPromo;
      saleForm.manualPrice = null;
      renderSaleModal();
    }

    function setSaleDate(d) {
      if (!d) return;
      saleForm.date = d;
      renderSaleModal();
    }

    function onSalePriceManual(val) {
      const num = Number(val);
      saleForm.manualPrice = isNaN(num) ? 0 : Math.max(0, num);
      updateSaleModalDynamicFields();
    }

    function updateSaleModalDynamicFields() {
      const pastOrders = saleForm.clientId ? getClientSales(saleForm.clientId).length : 0;
      const isNewClient = pastOrders === 0;
      const autoPrice = calculateSalePrice(saleForm.qty, saleForm.applyPromo);
      const finalPrice = saleForm.manualPrice !== null ? saleForm.manualPrice : autoPrice;
      const pocketPct = appData.settings.pocketPercent;
      const pocketShare = Math.round(finalPrice * (pocketPct / 100));
      const fundShare = finalPrice - pocketShare;
      const stockAfter = appData.inventory.freezerStock - saleForm.qty;
      const savings = (saleForm.applyPromo && saleForm.qty >= 3)
        ? (appData.settings.unitPrice * 3 - appData.settings.promo3Price)
        : 0;

      const badge = document.getElementById('sale-client-badge');
      if (badge) {
        badge.className = `text-[11px] font-semibold px-2 py-0.5 rounded-full ${isNewClient ? 'bg-[#FF6B4A]/15 text-[#FF6B4A]' : 'bg-[#22C55E]/15 text-[#22C55E]'}`;
        badge.textContent = isNewClient ? '✨ Новый клиент' : `⭐ Постоянный (${pastOrders} зак.)`;
      }

      const toggle = document.getElementById('sale-promo-toggle');
      if (toggle) {
        toggle.className = `w-12 h-7 rounded-full p-1 transition-colors shrink-0 ${saleForm.applyPromo ? 'bg-[#FF6B4A]' : 'bg-white/15'}`;
        toggle.firstElementChild.className = `w-5 h-5 rounded-full bg-white shadow transition-transform ${saleForm.applyPromo ? 'translate-x-5' : 'translate-x-0'}`;
      }

      const promoSub = document.getElementById('sale-promo-sub');
      if (promoSub) {
        promoSub.textContent = saleForm.qty < 3
          ? 'Действует при заказе от 3 штук'
          : (saleForm.applyPromo ? `Применена к первым 3 шт (скидка ${savings} ₽)` : 'Отключена — по базовой цене');
      }

      const priceInput = document.getElementById('sale-price-input');
      if (priceInput && saleForm.manualPrice === null) {
        priceInput.value = finalPrice;
      }

      const preview = document.getElementById('sale-preview-box');
      if (preview) {
        preview.innerHTML = `
          <div>
            <p class="text-[10px] text-slate-400">В карман (${pocketPct}%)</p>
            <p class="text-xs font-bold text-[#22C55E] mt-0.5">+${formatRub(pocketShare)}</p>
          </div>
          <div>
            <p class="text-[10px] text-slate-400">В фонд (${100 - pocketPct}%)</p>
            <p class="text-xs font-bold text-slate-200 mt-0.5">+${formatRub(fundShare)}</p>
          </div>
          <div>
            <p class="text-[10px] text-slate-400">В морозилке</p>
            <p class="text-xs font-bold mt-0.5 ${stockAfter < 0 ? 'text-rose-400' : 'text-[#38BDF8]'}">${stockAfter} шт</p>
          </div>
        `;
      }

      const btn = document.getElementById('sale-submit-btn');
      if (btn) btn.textContent = `Записать продажу • ${formatRub(finalPrice)}`;
    }

    function submitSale() {
      const name = saleForm.newClientName.trim();
      if (!name) {
        showToast('Укажите имя клиента', 'warning');
        return;
      }

      let clientId = saleForm.clientId;
      if (!clientId) {
        const existing = appData.clients.find(c => c.name.trim().toLowerCase() === name.toLowerCase());
        if (existing) {
          clientId = existing.id;
        } else {
          clientId = genId('c');
          appData.clients.push({
            id: clientId,
            name,
            contact: 'Авито',
            dailyRateOverride: null,
            notes: ''
          });
        }
      }

      const qty = Math.max(1, Number(saleForm.qty) || 1);
      const autoPrice = calculateSalePrice(qty, saleForm.applyPromo);
      const totalPrice = saleForm.manualPrice !== null ? saleForm.manualPrice : autoPrice;
      const pocketPct = appData.settings.pocketPercent;
      const pocketShare = Math.round(totalPrice * (pocketPct / 100));
      const fundShare = totalPrice - pocketShare;

      appData.sales.push({
        id: genId('s'),
        date: saleForm.date || todayStr(),
        clientId,
        qty,
        isPromoApplied: Boolean(saleForm.applyPromo && qty >= 3),
        totalPrice,
        pocketShare,
        fundShare,
        note: ''
      });

      appData.inventory.freezerStock -= qty;
      saveData();
      closeModal();
      renderAll();
      showToast(`Продажа на ${formatRub(totalPrice)} записана! В карман +${formatRub(pocketShare)}`, 'success');
    }

    function confirmDeleteSale(saleId) {
      const s = appData.sales.find(x => x.id === saleId);
      if (!s) return;
      openConfirmModal({
        title: 'Удалить продажу?',
        message: `Сумма ${formatRub(s.totalPrice)} будет убрана из статистики, а ${s.qty} шт вернутся обратно в морозилку.`,
        confirmText: 'Удалить',
        danger: true,
        onConfirm: () => {
          appData.sales = appData.sales.filter(x => x.id !== saleId);
          appData.inventory.freezerStock += s.qty;
          saveData();
          renderAll();
          showToast('Продажа удалена, остаток восстановлен', 'info');
        }
      });
    }

    /* =========================================================================
       МОДАЛКА: + ЗАКУПКА (ПАРТИЯ МЯСА ИЛИ ТАРА ОТДЕЛЬНО)
       ========================================================================= */

    const purchaseForm = {
      tab: 'meat', // 'meat' | 'containers'
      meatCost: '',
      qtyProduced: '',
      weightKg: '',
      containersCost: 0,
      containersBought: '',
      date: todayStr(),
      note: ''
    };

    function openPurchaseModal(initialTab = 'meat') {
      purchaseForm.tab = initialTab;
      purchaseForm.meatCost = '';
      purchaseForm.qtyProduced = '';
      purchaseForm.weightKg = '';
      purchaseForm.containersCost = '';
      purchaseForm.containersBought = '';
      purchaseForm.date = todayStr();
      purchaseForm.note = '';
      renderPurchaseModal();
    }

    function renderPurchaseModal() {
      const isMeat = purchaseForm.tab === 'meat';
      const tStr = todayStr();
      const yStr = daysAgoStr(1);

      openSheetModal(`
        <div class="p-5 space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="text-lg font-extrabold text-white">Новая закупка</h2>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-white/[0.08] flex items-center justify-center text-slate-400">✕</button>
          </div>

          <!-- Табы внутри модалки -->
          <div class="grid grid-cols-2 p-1 rounded-2xl bg-black/35 border border-white/[0.06] text-xs font-bold">
            <button onclick="purchaseForm.tab='meat'; renderPurchaseModal()" class="py-2.5 rounded-xl transition ${isMeat ? 'bg-[#22C55E] text-slate-950' : 'text-slate-400'}">🥩 Партия корма</button>
            <button onclick="purchaseForm.tab='containers'; renderPurchaseModal()" class="py-2.5 rounded-xl transition ${!isMeat ? 'bg-[#38BDF8] text-slate-950' : 'text-slate-400'}">📦 Тара / Расходы</button>
          </div>

          ${isMeat ? `
            <div class="space-y-3">
              <div class="grid grid-cols-2 gap-2.5">
                <div class="space-y-1">
                  <label class="text-[11px] font-semibold text-slate-400">Потратил на мясо (₽)</label>
                  <input id="p-meat-cost" type="number" min="0" value="${purchaseForm.meatCost}" oninput="purchaseForm.meatCost=this.value; updatePurchaseUnitPreview()" placeholder="5000" class="w-full px-3.5 py-3 rounded-2xl bg-black/35 border border-white/10 text-base font-bold text-white tnum focus:outline-none focus:border-[#22C55E]" />
                </div>
                <div class="space-y-1">

            <div class="space-y-3">
              <div class="grid grid-cols-2 gap-2.5">
                <div class="space-y-1">
                  <label class="text-[11px] font-semibold text-slate-400">Сумма расхода (₽)</label>
                  <input type="number" min="0" value="${purchaseForm.containersCost}" oninput="purchaseForm.containersCost=this.value" placeholder="890" class="w-full px-3.5 py-3 rounded-2xl bg-black/35 border border-white/10 text-base font-bold text-white tnum focus:outline-none focus:border-[#38BDF8]" />

          </button>

      `);
      if (isMeat) updatePurchaseUnitPreview();
    }

    function updatePurchaseUnitPreview() {
      const box = document.getElementById('p-unit-preview');
      const wInput = document.getElementById('p-weight');
      const meatCost = Number(purchaseForm.meatCost) || 0;
      const qty = Number(purchaseForm.qtyProduced) || 0;

      if (wInput && qty > 0) {
        wInput.placeholder = `~${(qty * 0.3).toFixed(1)} кг`;
      }

      if (!box) return;
      if (meatCost > 0 && qty > 0) {
        const unitCost = Math.round(meatCost / qty);
        const margin = appData.settings.unitPrice - unitCost;
        const marginPct = Math.round((margin / appData.settings.unitPrice) * 100);
        box.innerHTML = `
          <div>
            <p class="text-[10px] text-slate-400">Себестоимость мяса</p>
            <p class="text-sm font-extrabold text-white">${unitCost} ₽ / шт</p>
          </div>
          <div class="text-right">
            <p class="text-[10px] text-slate-400">Маржа с банки (${appData.settings.unitPrice} ₽)</p>
            <p class="text-sm font-extrabold ${margin >= 0 ? 'text-[#22C55E]' : 'text-rose-400'}">${margin >= 0 ? '+' : ''}${margin} ₽ (${marginPct}%)</p>
          </div>
        `;
      } else {
        box.innerHTML = `<span class="text-slate-400">Введите сумму на мясо и кол-во банок для расчета маржи</span>`;
      }
    }

    function submitPurchase() {
      if (purchaseForm.tab === 'meat') {
        const meatCost = Number(purchaseForm.meatCost) || 0;
        const qtyProduced = Math.round(Number(purchaseForm.qtyProduced) || 0);
        const containersCost = Number(purchaseForm.containersCost) || 0;
        const containersBought = Math.round(Number(purchaseForm.containersBought) || 0);
        const weightKg = Number(purchaseForm.weightKg) || Number((qtyProduced * 0.3).toFixed(1));

        if (meatCost <= 0 || qtyProduced <= 0) {
          showToast('Укажите сумму на мясо и количество получившихся банок', 'warning');
          return;
        }

        appData.purchases.push({
          id: genId('p'),
          type: 'meat',
          date: purchaseForm.date || todayStr(),
          meatCost,
          containersCost,
          qtyProduced,
          weightKg,
          containersBought,
          note: purchaseForm.note.trim()
        });

        appData.inventory.freezerStock += qtyProduced;
        appData.inventory.emptyContainers = Math.max(0, appData.inventory.emptyContainers + containersBought - qtyProduced);

        saveData();
        closeModal();
        renderAll();
        showToast(`Партия +${qtyProduced} шт добавлена! Себестоимость ${Math.round(meatCost / qtyProduced)} ₽/шт`, 'success');
      } else {
        const containersCost = Number(purchaseForm.containersCost) || 0;
        const containersBought = Math.round(Number(purchaseForm.containersBought) || 0);
        if (containersCost <= 0) {
          showToast('Укажите сумму расхода', 'warning');
          return;
        }

        appData.purchases.push({
          id: genId('p'),
          type: 'containers',
          date: purchaseForm.date || todayStr(),
          meatCost: 0,
          containersCost,
          qtyProduced: 0,
          weightKg: 0,
          containersBought,
          note: purchaseForm.note.trim() || 'Контейнеры / прочее'
        });

        if (containersBought > 0) {
          appData.inventory.emptyContainers += containersBought;
        }

        saveData();
        closeModal();
        renderAll();
        showToast(`Расход ${formatRub(containersCost)} записан`, 'success');
      }
    }

    function confirmDeletePurchase(purchaseId) {
      const p = appData.purchases.find(x => x.id === purchaseId);
      if (!p) return;
      openConfirmModal({
        title: 'Удалить закупку?',
        message: p.type === 'meat'
          ? `Из морозилки будет вычтено ${p.qtyProduced} шт, а расход ${formatRub((p.meatCost || 0) + (p.containersCost || 0))} убран из фонда.`
          : `Расход ${formatRub(p.containersCost)} будет удален из истории.`,
        confirmText: 'Удалить',
        danger: true,
        onConfirm: () => {
          if (p.type === 'meat') {
            appData.inventory.freezerStock = Math.max(0, appData.inventory.freezerStock - (p.qtyProduced || 0));
            appData.inventory.emptyContainers = Math.max(0, appData.inventory.emptyContainers + (p.qtyProduced || 0) - (p.containersBought || 0));
          } else if (p.containersBought > 0) {
            appData.inventory.emptyContainers = Math.max(0, appData.inventory.emptyContainers - p.containersBought);
          }
          appData.purchases = appData.purchases.filter(x => x.id !== purchaseId);
          saveData();
          renderAll();
          showToast('Закупка удалена', 'info');
        }
      });
    }

    /* =========================================================================
       МОДАЛКА: МОРОЗИЛКА И БЫСТРОЕ СПИСАНИЕ КОШКЕ
       ========================================================================= */

    function feedOwnCat() {
      if (appData.inventory.freezerStock <= 0) {
        showToast('В морозилке уже 0 шт — сначала скорректируйте остаток', 'warning');
        return;
      }
      appData.inventory.freezerStock -= 1;
      appData.inventory.catConsumed = (appData.inventory.catConsumed || 0) + 1;
      saveData();
      renderAll();
      showToast(`Списана 1 банка для вашей кошки 🐾 (осталось ${appData.inventory.freezerStock} шт)`, 'info', {
        label: 'Отменить',
        onClick: () => {
          appData.inventory.freezerStock += 1;
          appData.inventory.catConsumed = Math.max(0, (appData.inventory.catConsumed || 1) - 1);
          saveData();
          renderAll();
          showToast('Списание отменено', 'info');
        }
      });
    }

              <label class="text-xs font-semibold text-[#38BDF8]">Готового корма в морозилке (шт по 300 г)</label>

            </div>

            <div class="space-y-1.5">
              <label class="text-xs font-semibold text-slate-400">Пустых контейнеров в запасе (шт, опц.)</label>
              <input id="stock-empty-input" type="number" min="0" value="${appData.inventory.emptyContainers}" class="w-full px-4 py-3 rounded-2xl bg-black/35 border border-white/10 text-base font-bold text-white tnum text-center focus:outline-none focus:border-white/30" />
            </div>

            ${!isFreshStart ? `
              <div class="p-3 rounded-2xl bg-white/[0.04] border border-white/[0.06] flex items-center justify-between text-xs">
                <span class="text-slate-400">Всего съела ваша кошка:</span>
                <span class="font-bold text-slate-200 tnum">${appData.inventory.catConsumed || 0} шт 🐾</span>

          </div>

          <button onclick="saveStockAdjust()" class="w-full py-4 rounded-2xl bg-[#38BDF8] text-slate-950 font-extrabold text-sm shadow-lg shadow-[#38BDF8]/20 active:scale-[0.98] transition">
            Сохранить остаток
          </button>
        </div>
      `);
      setTimeout(() => {
        const inp = document.getElementById('stock-freezer-input');
        if (inp) { inp.focus(); inp.select(); }
      }, 120);
    }

    function saveStockAdjust() {
      const fVal = Math.max(0, Math.round(Number(document.getElementById('stock-freezer-input').value) || 0));
      const eVal = Math.max(0, Math.round(Number(document.getElementById('stock-empty-input').value) || 0));
      appData.inventory.freezerStock = fVal;
      appData.inventory.emptyContainers = eVal;
      saveData();
      closeModal();
      renderAll();
      showToast(`В морозилке теперь ${fVal} шт (${(fVal * 0.3).toFixed(1)} кг)`, 'success');
    }

    function openClientDetailModal(clientId) {
      const isNew = !clientId;
      const client = isNew
        ? { id: null, name: '', contact: 'Авито', dailyRateOverride: null, notes: '' }
        : getClientById(clientId);
      if (!client) return;

      const forecast = isNew ? null : computeClientForecast(client);
      const history = isNew ? [] : getClientSales(client.id).reverse();

      openSheetModal(`
        <div class="p-5 space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="text-lg font-extrabold text-white">${isNew ? 'Новый клиент' : 'Карточка клиента'}</h2>

          </div>

            <div class="space-y-1">
              <label class="text-[11px] font-semibold text-slate-400">Имя / Питомец</label>
              <input id="cd-name" type="text" value="${escapeHtml(client.name)}" placeholder="Например: Анна (Мейн-кун)" class="w-full px-3.5 py-2.5 rounded-2xl bg-black/35 border border-white/10 text-sm text-white focus:outline-none focus:border-[#F59E0B]" />
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <div class="space-y-1">
                <label class="text-[11px] font-semibold text-slate-400">Контакт / Район</label>
                <input id="cd-contact" type="text" value="${escapeHtml(client.contact || '')}" placeholder="Авито / Telegram" class="w-full px-3.5 py-2.5 rounded-2xl bg-black/35 border border-white/10 text-sm text-white focus:outline-none focus:border-[#F59E0B]" />
              </div>
              <div class="space-y-1">
                <label class="text-[11px] font-semibold text-slate-400">Расход (банок/день)</label>
                <input id="cd-rate" type="number" step="0.25" min="0.2" max="10" value="${client.dailyRateOverride ?? ''}" placeholder="Авто (1.0)" class="w-full px-3.5 py-2.5 rounded-2xl bg-black/35 border border-white/10 text-sm text-white tnum focus:outline-none focus:border-[#F59E0B]" />
              </div>
            </div>
            <p class="text-[10px] text-slate-500 -mt-1.5">Оставьте «Расход» пустым для авто-прогноза по истории заказов, или укажите (напр. 2 если два кота).</p>

            <div class="space-y-1">
              <label class="text-[11px] font-semibold text-slate-400">Заметка</label>
              <input id="cd-notes" type="text" value="${escapeHtml(client.notes || '')}" placeholder="Предпочтения, время самовывоза..." class="w-full px-3.5 py-2.5 rounded-2xl bg-black/35 border border-white/10 text-sm text-white focus:outline-none focus:border-[#F59E0B]" />
            </div>
          </div>

          <div class="flex gap-2">
            <button onclick="saveClientDetail('${client.id || ''}')" class="flex-1 py-3.5 rounded-2xl bg-[#FF6B4A] text-white font-bold text-sm active:scale-95 transition">Сохранить</button>
            ${!isNew ? `<button onclick="confirmDeleteClient('${client.id}')" class="px-4 py-3.5 rounded-2xl bg-rose-500/15 border border-rose-500/30 text-rose-300 text-xs font-bold active:scale-95 transition">Удалить</button>` : ''}
          </div>

          ${!isNew && history.length > 0 ? `
            <div class="pt-2 border-t border-white/[0.08] space-y-2">
              <div class="flex items-center justify-between text-xs">
                <span class="font-bold text-slate-300">История заказов (${history.length})</span>
                <span class="text-slate-400 tnum">Всего: ${forecast.totalQty} шт • ${formatRub(forecast.totalSpent)}</span>
              </div>
              <div class="max-h-44 overflow-y-auto space-y-1.5">
                ${history.map(s => `
                  <div class="px-3 py-2 rounded-xl bg-black/30 flex items-center justify-between text-xs tnum">
                    <span class="text-slate-300">${formatDateFull(s.date)}</span>
                    <span class="font-bold text-white">${s.qty} шт — ${formatRub(s.totalPrice)}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `);
    }

    function saveClientDetail(clientId) {
      const name = document.getElementById('cd-name').value.trim();
      const contact = document.getElementById('cd-contact').value.trim();
      const rateRaw = document.getElementById('cd-rate').value.trim();
      const notes = document.getElementById('cd-notes').value.trim();

      if (!name) {
        showToast('Введите имя клиента', 'warning');
        return;
      }

      const dailyRateOverride = rateRaw !== '' && Number(rateRaw) > 0 ? Number(rateRaw) : null;

      if (clientId) {
        const c = getClientById(clientId);
        if (c) {
          c.name = name;
          c.contact = contact;
          c.dailyRateOverride = dailyRateOverride;
          c.notes = notes;
        }
      } else {
        appData.clients.push({
          id: genId('c'),
          name,
          contact,
          dailyRateOverride,
          notes
        });
      }

      saveData();
      closeModal();
      renderAll();
      showToast('Данные клиента сохранены', 'success');
    }

    function confirmDeleteClient(clientId) {
      const c = getClientById(clientId);
      if (!c) return;
      openConfirmModal({
        title: `Удалить клиента «${c.name}»?`,
        message: 'Карточка клиента будет удалена. Прошлые продажи останутся в финансовой статистике.',
        confirmText: 'Удалить',
        danger: true,
        onConfirm: () => {
          appData.clients = appData.clients.filter(x => x.id !== clientId);
          saveData();
          renderAll();
          showToast('Клиент удален', 'info');
        }
      });
    }

            <p class="text-[11px] text-slate-400 leading-snug">Данные хранятся локально на вашем iPhone. Периодически сохраняйте копию в Файлы iCloud.</p>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="exportJsonBackup()" class="py-3 px-3 rounded-2xl bg-white/[0.07] border border-white/10 text-xs font-bold text-white active:scale-95 transition">
                ⬇ Скачать JSON
              </button>
              <button onclick="triggerJsonImport()" class="py-3 px-3 rounded-2xl bg-white/[0.07] border border-white/10 text-xs font-bold text-[#38BDF8] active:scale-95 transition">
                ⬆ Импорт JSON
              </button>
            </div>
          </div>

          <!-- Управление данными -->
          <div class="space-y-2 pt-3 border-t border-white/[0.08]">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Управление базой</h3>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="confirmLoadDemo()" class="py-2.5 px-3 rounded-2xl bg-[#F59E0B]/12 border border-[#F59E0B]/25 text-xs font-semibold text-[#F59E0B] active:scale-95 transition">
                Загрузить демо
              </button>
              <button onclick="promptStartFresh()" class="py-2.5 px-3 rounded-2xl bg-rose-500/12 border border-rose-500/25 text-xs font-semibold text-rose-300 active:scale-95 transition">
                Очистить всё
              </button>
            </div>
          </div>

          <!-- Памятка для iPhone -->
          <details class="rounded-2xl bg-black/30 border border-white/[0.06] p-3 text-xs text-slate-400">
            <summary class="font-semibold text-slate-200 cursor-pointer">📱 Как установить как приложение на iPhone</summary>
            <ol class="mt-2 space-y-1.5 list-decimal list-inside leading-relaxed">
              <li>Загрузите этот файл <code class="text-slate-200">index.html</code> в репозиторий GitHub и включите <b>GitHub Pages</b> (Settings → Pages → Branch: main).</li>
              <li>Откройте полученную ссылку в <b>Safari</b> на iPhone.</li>
              <li>Нажмите кнопку <b>«Поделиться»</b> (квадрат со стрелкой вверх) → <b>«На экран „Домой“»</b>.</li>
            </ol>
          </details>
        </div>
      `);
    }

    function saveSettingsForm() {
      const unitPrice = Math.max(1, Math.round(Number(document.getElementById('set-unit-price').value) || 210));
      const promo3Price = Math.max(1, Math.round(Number(document.getElementById('set-promo-price').value) || 550));
      const pocketPercent = Math.max(0, Math.min(100, Math.round(Number(document.getElementById('set-pocket-pct').value) ?? 50)));
      const startingFund = Math.round(Number(document.getElementById('set-start-fund').value) || 0);

      appData.settings.unitPrice = unitPrice;
      appData.settings.promo3Price = promo3Price;
      appData.settings.pocketPercent = pocketPercent;
      appData.settings.startingFund = startingFund;

      saveData();
      closeModal();
      renderAll();
      showToast('Настройки обновлены', 'success');
    }

    function exportJsonBackup() {
      try {
        const json = JSON.stringify(appData, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `myasomix-backup-${todayStr()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Файл бэкапа сохранен!', 'success');
      } catch (e) {
        copyTextToClipboard(JSON.stringify(appData), 'JSON скопирован в буфер!');
      }
    }

    function triggerJsonImport() {
      const inp = document.getElementById('json-import-input');
      inp.value = '';
      inp.click();
    }

    function handleJsonImportFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || !parsed.settings || !Array.isArray(parsed.sales) || !Array.isArray(parsed.purchases)) {
            throw new Error('Неверный формат файла');
          }
          appData = parsed;
          saveData();
          closeModal();
          renderAll();
          showToast('Данные успешно восстановлены из бэкапа!', 'success');
        } catch (err) {
          showToast('Ошибка импорта: выберите корректный JSON файл МясоМикс CRM', 'error');
        }
      };
      reader.readAsText(file);
    }

    function promptStartFresh() {
      openConfirmModal({
        title: 'Начать с чистого листа?',
        message: 'Все текущие (или демо) записи будут очищены, и вы сразу укажете, сколько банок сейчас лежит в вашей морозилке.',
        confirmText: 'Очистить и начать',
        danger: true,
        onConfirm: () => {
          appData = createEmptyState();
          saveData();
          renderAll();
          openStockModal(true);
        }
      });
    }

    function confirmLoadDemo() {
      openConfirmModal({
        title: 'Загрузить демо-данные?',
        message: 'Текущие данные будут заменены демонстрационным примером с клиентами, закупками и графиками.',
        confirmText: 'Загрузить демо',
        onConfirm: () => {
          appData = createDemoState();
          saveData();
          renderAll();
          showToast('Демо-данные загружены', 'info');
        }
      });
    }

    /* =========================================================================
       ЗАПУСК ПРИЛОЖЕНИЯ
       ========================================================================= */

    document.addEventListener('DOMContentLoaded', () => {
      loadData();
      renderAll();
    });
  </script>
</body>
</html>
